# Preflight for the automatic producer: does Claude Code start on a runner, and which models does the
# owner's token allow? Runs only when a file under engine/diag/ is pushed to main. Prints fixed fields only.
name: diag

on:
  push:
    branches: [main]
    paths: ["engine/diag/ping.json"]

permissions: {}

concurrency:
  group: if-engine-diag
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.321"

jobs:
  claude:
    if: github.repository == 'dsamyes/youtube'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: |
          npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          node -v; claude --version; nproc; free -g | sed -n 2p
      - name: One-word reply per model
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret missing"; exit 1; fi
          # the secret was pasted with a terminal line wrap in it; a token never contains whitespace
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"; export CLAUDE_CODE_OAUTH_TOKEN
          mkdir -p "$RUNNER_TEMP/h" "$RUNNER_TEMP/w"; cd "$RUNNER_TEMP/w"
          ok=0
          for m in claude-fable-5-2 opus sonnet; do
            set +e
            HOME="$RUNNER_TEMP/h" timeout 120 claude -p "Reply with the single word OK." --model "$m" --max-turns 1 \
              --output-format json > out.json 2> err.log
            rc=$?
            set -e
            line=$(jq -r '"subtype=\(.subtype) error=\(.is_error) turns=\(.num_turns) ms=\(.duration_ms) models=\((.modelUsage // {}) | keys | join(","))"' out.json 2>/dev/null || true)
            echo "model=$m exit=$rc ${line:-no JSON}"
            if [ "$rc" -ne 0 ]; then
              # CLI start-up errors only (no model output): first lines, capped
              head -c 400 err.log | tr -cd '[:print:]\n' | head -5 || true
              jq -r '(.result // "") | tostring | .[0:200]' out.json 2>/dev/null | tr -cd '[:print:]\n' || true
            else
              ok=1
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::no model answered"; exit 1; }

  # The producer's exact start-up (same packages, caches, settings and isolation), then three of its real
  # commands run by Claude inside the subprocess sandbox. Fixed fields only in the log.
  sandbox:
    if: github.repository == 'dsamyes/youtube'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REMOTION_CHROME: bundled
      REMOTION_GL: swangle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System packages (ffmpeg, bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg bubblewrap socat >/dev/null
          if bwrap --ro-bind / / --dev /dev --proc /proc true 2>/dev/null; then echo "bwrap: works as installed"; else
            echo "bwrap: blocked by the user-namespace restriction, lifting it"
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --ro-bind / / --dev /dev --proc /proc true && echo "bwrap: works after sysctl"
          fi
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/.venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('engine/requirements.txt') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/remotion/node_modules
          key: node-${{ runner.os }}-n22-${{ hashFiles('engine/remotion/package-lock.json') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/models
          key: kokoro-v1.0
      - name: Setup engine
        run: engine/setup.sh
      - name: Install Claude Code
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Which start-up lets the Bash tool run unattended? (sonnet, one tiny command each)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret missing"; exit 1; fi
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"; export CLAUDE_CODE_OAUTH_TOKEN
          mkdir -p "$RUNNER_TEMP/h"
          try() {  # name, scrub, command, extra flags...
            name=$1; scrub=$2; cmd=$3; shift 3
            rm -rf engine/videos/_probe
            set +e
            HOME="$RUNNER_TEMP/h" CLAUDE_CODE_SUBPROCESS_ENV_SCRUB="$scrub" timeout 180 claude -p "Run this one shell command with the Bash tool from the repository root, then reply with the single word DONE: $cmd" \
              --model sonnet --max-turns 4 --output-format stream-json --verbose "$@" > "$RUNNER_TEMP/v.jsonl" 2> "$RUNNER_TEMP/v.err"
            rc=$?
            set -e
            res=$(jq -r 'select(.type=="user") | .message.content[]? | select(.type=="tool_result") | "error=\(.is_error // false) \(.content | tostring | .[0:160])"' "$RUNNER_TEMP/v.jsonl" 2>/dev/null | tr -cd '[:print:]\n' | head -1)
            [ -n "$res" ] || res="no tool result; $(head -c 200 "$RUNNER_TEMP/v.err" | tr -cd '[:print:]' )"
            wrote=no; [ -f engine/videos/_probe/hello.txt ] && wrote=yes
            echo "VARIANT $name: exit=$rc file_written=$wrote | $res"
          }
          probe() {  # name, extra flags...: the real probe (voice, a still through headless Chrome, ffmpeg)
            name=$1; shift
            rm -rf engine/videos/_probe engine/remotion/out/_template
            set +e
            HOME="$RUNNER_TEMP/h" CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 BASH_DEFAULT_TIMEOUT_MS=600000 BASH_MAX_TIMEOUT_MS=3600000 timeout 900 \
              claude -p "Run this one shell command with the Bash tool from the repository root, with a timeout of 900000 ms, then reply with the single word DONE: bash engine/diag/sandbox_probe.sh" \
              --model sonnet --max-turns 4 --output-format stream-json --verbose "$@" > "$RUNNER_TEMP/v.jsonl" 2> "$RUNNER_TEMP/v.err"
            rc=$?
            set -e
            res=$(jq -r 'select(.type=="user") | .message.content[]? | select(.type=="tool_result") | "error=\(.is_error // false) \(.content | tostring | .[0:260])"' "$RUNNER_TEMP/v.jsonl" 2>/dev/null | tr -cd '[:print:]\n' | head -1)
            R=engine/videos/_probe/result.txt
            echo "PROBE $name: exit=$rc | $res"
            if [ -f "$R" ]; then echo "PROBE $name: $(grep -E '^(voice|still|ffmpeg|token_visible|tmp_write)=[0-9]+$' "$R" | tr '\n' ' ')"; else echo "PROBE $name: no result file"; fi
            if [ -f engine/remotion/out/_template/stills/f30.jpg ]; then echo "PROBE $name: still file $(stat -c %s engine/remotion/out/_template/stills/f30.jpg) bytes"; else echo "PROBE $name: still file missing"; fi
            for l in voice still; do
              if [ -f "engine/videos/_probe/$l.log" ] && ! grep -q "^$l=0$" "$R" 2>/dev/null; then
                echo "PROBE $name: $l.log, error lines and first lines:"
                grep -m6 -iE "error|EACCES|EROFS|EPERM|ENOENT|denied|not permitted|cannot" "engine/videos/_probe/$l.log" | cut -c1-400 | tr -cd '[:print:]\n' || true
                head -c 1500 "engine/videos/_probe/$l.log" | tr -cd '[:print:]\n' | head -14
              fi
            done
          }
          S=engine/producer.settings.json
          TOOLS="Bash Read Edit Write Glob Grep WebSearch WebFetch TodoWrite"
          # the real probe (voice, a still through headless Chrome, ffmpeg) with the producer's flags
          probe "P3 allowedTools producer-settings" --allowedTools $TOOLS --settings "$S"

  trends:
    if: github.repository == 'dsamyes/youtube'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Trend sources reachable from a runner? (counts only)
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          grep -E '^(google-api-python-client|google-auth-oauthlib|google-auth-httplib2)==' engine/requirements.txt > "$RUNNER_TEMP/req.txt"
          python -m pip install -q -r "$RUNNER_TEMP/req.txt"
          umask 077; mkdir -p engine/secrets
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > engine/secrets/client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > engine/secrets/token.json
          python -B engine/toon/trends.py --out "$RUNNER_TEMP/trends.json" || true
          rm -f engine/secrets/client_secret.json engine/secrets/token.json
